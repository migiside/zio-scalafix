name: CI

on:
  push:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Build
        shell: bash
        run: sbt "scalafixAll --check;scalafmtSbtCheck;scalafmtCheck;"
  build:
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v6
      - name: Setup
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Build
        shell: bash
        run: sbt compile
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - name: Setup
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Test
        shell: bash
        run: sbt test